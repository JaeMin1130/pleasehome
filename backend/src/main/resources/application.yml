server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: pleasehome-backend
  housing:
    datasource:
      url: jdbc:sqlite:../db-pipeline/public_housing.db
      driver-class-name: org.sqlite.JDBC
  user:
    datasource:
      url: jdbc:sqlite:../db-pipeline/user_data.db
      driver-class-name: org.sqlite.JDBC
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

cors:
  allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,https://pleasehome.com,https://www.pleasehome.com"
